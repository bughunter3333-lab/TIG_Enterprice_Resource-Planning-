name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: ruff
        run: ruff check app tests

      - name: black
        run: black --check app tests

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    defaults:
      run:
        working-directory: backend

    env:
      SECRET_KEY: ci-test-secret-not-for-production
      DATABASE_URL: sqlite:///./ci_test.db
      ENVIRONMENT: test

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Unit tests
        run: pytest -m unit -v --no-cov

      - name: Integration tests
        run: pytest -m integration -v --no-cov

      - name: Full suite + coverage (Python 3.11 only)
        if: matrix.python-version == '3.11'
        run: pytest --cov-report=xml --cov-report=term-missing

      - name: Upload coverage report
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v7
        with:
          files: backend/coverage.xml
          fail_ci_if_error: false

  migrations:
    # The test job runs on SQLite, which ignores column lengths and never runs
    # a migration — so a model column the database lacks, or a VARCHAR too
    # narrow for the value, passes every test and fails only in production.
    # Both have shipped here. This job builds the schema the way a deploy does,
    # from nothing on real Postgres, then asks whether the models agree with it.
    name: Migrations (Postgres)
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    env:
      SECRET_KEY: ci-test-secret-not-for-production
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      ENVIRONMENT: test

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Upgrade an empty database to head
        run: python -m alembic upgrade head

      - name: Models match the migrated schema
        run: python -m alembic check

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        # husky's prepare script only sets a local git hooks path, which does
        # nothing useful on a runner that makes one commit and disappears.
        run: npm ci
        env:
          HUSKY: 0

      # First, because it is the cheapest check and catches the failure the
      # build cannot: esbuild resolves no identifiers, so a reference to a name
      # that was never imported builds clean and throws in the browser. That
      # shipped here twice.
      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
