# Ruff's settings. They used to sit in pyproject.toml, but Vercel's Python build
# reads any pyproject.toml here as the API's package list and stops on one that
# has no [project] table. Black needs no settings: its defaults (line length 88,
# target versions read from the code) format this code exactly as before.
target-version = "py311"

[lint]
# Ruff's default rule set is E4/E7/E9/F. Keep all correctness rules (pyflakes F,
# syntax E9, comparison/style E7 that catch real issues); relax the purely
# cosmetic layout rules this codebase intentionally uses.
ignore = [
    "E701",  # multiple statements on one line (colon) - compact guard clauses
    "E702",  # multiple statements on one line (semicolon)
    "E741",  # ambiguous variable name (e.g. single-letter loop vars)
    "E402",  # module-level import not at top (late/conditional imports)
]

[lint.per-file-ignores]
# The model package is an aggregator: importing every model registers its table
# on Base.metadata for create_all() and Alembic autogenerate. These imports are
# intentional side effects, not dead code.
"app/models/__init__.py" = ["F401"]