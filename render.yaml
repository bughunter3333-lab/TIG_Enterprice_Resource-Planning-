# Render Blueprint — deploys the FastAPI backend. The database is on Supabase.
# Usage: Render dashboard → New → Blueprint → connect this repo. Render reads this file,
# asks for DATABASE_URL, generates SECRET_KEY, runs migrations on every start, and
# serves uvicorn on $PORT behind HTTPS.
#
# After the first deploy:
#   1. Create the first admin user — see "Seed the first admin user" in DEPLOY.md
#      (a free web service has no Shell tab, so it is run from your own computer).
#   2. Copy the service URL (https://<name>.onrender.com) into frontend/vercel.json if it differs.
# See DEPLOY.md for the full runbook.

services:
  - type: web
    name: tig-erp-api
    runtime: python
    rootDir: backend
    plan: free          # bump to `starter` to avoid cold-start sleeps in production
    buildCommand: pip install -r requirements.txt
    # Run pending migrations, then start the API. Alembic upgrade is idempotent.
    startCommand: python -m alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      # The Supabase "Session pooler" connection string, set by hand in the Render
      # dashboard and kept out of git. `sync: false` matters: wired to a Render
      # database with `fromDatabase`, every Blueprint sync (every push) put the old
      # value back over whatever the dashboard held.
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true        # Render generates a strong value once and keeps it
      - key: ENVIRONMENT
        value: production           # enables JSON logs + Secure cookies
      - key: PYTHON_VERSION
        value: "3.12.3"
      # Optional — only needed for the AI assistant features:
      # - key: ANTHROPIC_API_KEY
      #   sync: false               # set manually in the dashboard (kept out of git)
